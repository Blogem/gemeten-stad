name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test ./...

  go-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.3

  go-integration:
    runs-on: ubuntu-latest
    env:
      # Required by the gdal sidecar's bind mount (deploy/compose/compose.yaml); this job
      # only starts db + fuseki, so the path is never read, but compose interpolates the
      # whole file up front and fails fast if it's unset.
      GS_RAW_DATA_PATH: /tmp/gs-raw-data
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The dump tool's pg_dump/pg_restore must match the compose db's major version
      # (imresamu/postgis:18-3.6); the runner preinstalls only client 16, so pull 18 from PGDG
      # and put it first on PATH. dump.CheckPgTools fails fast on any mismatch.
      - name: Install PostgreSQL 18 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
      - run: docker compose -f deploy/compose/compose.yaml up -d --wait db fuseki
      # -p 1: run one package binary at a time. load/graph and load/koop both target the
      # single shared gs-test Fuseki dataset (no per-package isolation); resetFusekiRunGraphs
      # wipes ALL run graphs, so parallel package binaries race and flake nondeterministically.
      - run: go test -tags=integration -p 1 ./...
        env:
          GS_TEST_DATABASE_URL: postgres://gs:gs@localhost:5433/gemeten_stad
          GS_TEST_FUSEKI_URL: http://localhost:3030
          FUSEKI_ADMIN_PASSWORD: admin
      - if: always()
        run: docker compose -f deploy/compose/compose.yaml down -v

  webapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run test
      - run: npm run build

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extract/ner
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
