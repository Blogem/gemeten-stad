version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: friday
    groups:
      go-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5

  - package-ecosystem: gomod
    directory: /webapp
    schedule:
      interval: weekly
      day: friday
    groups:
      go-webapp-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5

  - package-ecosystem: npm
    directory: /webapp
    schedule:
      interval: weekly
      day: friday
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5

  - package-ecosystem: pip
    directory: /extract/ner
    schedule:
      interval: weekly
      day: friday
    groups:
      pip-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5

  - package-ecosystem: docker
    directory: /cmd/server
    schedule:
      interval: weekly
      day: friday
    groups:
      docker-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: friday
    groups:
      actions-all:
        patterns:
          - "*"
        update-types:
          - major
          - minor
          - patch
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5
