version: "3"

vars:
  BIN_DIR: bin

tasks:
  build:
    desc: Build the Go binaries and the webapp
    cmds:
      - task: build:go
      - task: build:web

  build:go:
    desc: Build the pipeline and server binaries into {{.BIN_DIR}}/
    cmds:
      - go build -o {{.BIN_DIR}}/ ./cmd/pipeline ./cmd/server

  build:web:
    desc: Build the SvelteKit webapp
    dir: webapp
    cmds:
      - npm run build

  test:
    desc: Run all test suites (Go, webapp, Python)
    cmds:
      - task: test:go
      - task: test:web
      - task: test:python

  test:go:
    desc: Run the Go test suite
    cmds:
      - go test ./...

  test:integration:
    desc: >
      Run the Go integration test suite against the isolated test targets (Phase 0 · P5).
      Requires GS_TEST_DATABASE_URL, GS_TEST_FUSEKI_URL, FUSEKI_ADMIN_PASSWORD — see README.md.
      Typically run after `task compose:up`.
    cmds:
      # -p 1: run one package binary at a time. load/graph, load/koop, and derive/coverage
      # all target the same shared `gs-test` Fuseki dataset, so parallel package binaries would
      # race on it and fail non-deterministically. Mirrors .github/workflows/ci.yml.
      - go test -tags=integration -p 1 ./...

  test:web:
    desc: Run the webapp unit tests
    dir: webapp
    cmds:
      - npm run test

  test:python:
    desc: Run the Python NER extractor tests
    dir: extract/ner
    cmds:
      - pytest

  lint:
    desc: Run all linters (Go, webapp, Python)
    cmds:
      - task: lint:go
      - task: lint:web
      - task: lint:python

  lint:go:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run

  lint:web:
    desc: Run eslint on the webapp
    dir: webapp
    cmds:
      - npm run lint

  lint:python:
    desc: Run ruff check + format check on the Python NER extractor
    dir: extract/ner
    cmds:
      - ruff check .
      - ruff format --check .

  compose:up:
    desc: Bring up the dev stack (PostGIS + Fuseki + server + gdal sidecar)
    cmds:
      - docker compose -f deploy/compose/compose.yaml up -d --wait

  compose:down:
    desc: Stop the dev stack (add -- -v to also drop the data volumes)
    cmds:
      - docker compose -f deploy/compose/compose.yaml down {{.CLI_ARGS}}
