# Spike D — the geo bulk backbone (PostGIS + GDAL), run entirely in containers.
# The host has Docker but no ogr2ogr/psql/GDAL, so everything geo runs here.
# The DB lives on a named volume so the loaded 0363 BAG + polygons survive
# `docker compose down` — we never re-download (~3.6 GB) or re-parse all-NL twice.
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: geo
      POSTGRES_USER: geo
      POSTGRES_PASSWORD: geo
    ports:
      - "5433:5432"      # host 5433 to avoid clashing with a local postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geo -d geo"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ogr2ogr with the lvbag + PostgreSQL drivers, plus python3 for any glue.
  # Kept idle (`sleep infinity`); load.sh drives it with `compose exec`/`run`.
  gdal:
    image: ghcr.io/osgeo/gdal:ubuntu-full-latest
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/data          # cached extract + harvested artifacts
      - ./sql:/sql            # resolver / scorer SQL
    working_dir: /data
    command: ["sleep", "infinity"]

volumes:
  pgdata:
